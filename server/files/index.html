<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies!</title>
    <style>
        /* Part 3: Your styling goes here */
        .article {
            display: flex;
            justify-content: center;
            gap: 100px
        }

        .movieArticle {
            display: grid;
            width: 75%;
            box-shadow: rgb(36 220 36 / 0.5) 0 0 10px 5px;
            background-color: rgb(36 220 36 / 0.25);
            margin-bottom: 50px;
            padding: 20px 20px 20px 20px;
        }

        .poster {
            box-shadow: slategray 0 0 2px 2px;
        }
    </style>
    <script>
        // const escapeHtml = (value) => String(value)
        //     .replaceAll('&', '&amp;')
        //     .replaceAll('<', '&lt;')
        //     .replaceAll('>', '&gt;')
        //     .replaceAll('"', '&quot;')
        //     .replaceAll("'", '&#39;')

        const renderValuesAsList = (values) => {
            const items = Array.isArray(values) ? values : [values]

            return `
                <ul>
                    ${items.map(item => `<li>${item}</li>`).join('')}
                </ul>
            `
        }

        const formatReleaseDate = (released) => {
            const releasedDate = new Date(released)

            return releasedDate.toLocaleDateString('de-DE', {
                day: '2-digit',
                month: 'long',
                year: 'numeric'
            })
        }

        window.onload = function () {
            const xhr = new XMLHttpRequest()
            xhr.onload = function () {
                const bodyElement = document.querySelector("body")
                if (xhr.status === 200) {
                    /* Part 2: Build the HTML elements here and append them to the body */
                    const movies = JSON.parse(xhr.responseText)
                    movies.forEach(movie => {
                        const article = document.createElement("article")
                        article.className = 'article'
                        article.innerHTML = `
                            <article class="movieArticle">
                                <h1>${movie.Title}</h1>
                                <img class="poster" src="${movie.Poster}" alt="Poster for ${movie.Title}">
                                <p>${movie.Plot}</p>
                                <ul>
                                    <li><strong>Runtime:</strong> ${movie.Runtime} Minuten</li>
                                    <li><strong>imdbRating:</strong> ${movie.imdbRating}</li>
                                    <li><strong>Metascore:</strong> ${movie.Metascore}</li>
                                    <li>
                                        <strong>Genres:</strong>
                                        ${renderValuesAsList(movie.Genres)}
                                    </li>
                                    <li>
                                        <strong>Directors:</strong>
                                        ${renderValuesAsList(movie.Directors)}
                                    </li>
                                    <li>
                                        <strong>Writers:</strong>
                                        ${renderValuesAsList(movie.Writers)}
                                    </li>
                                    <li>
                                        <strong>Actors:</strong>
                                        ${renderValuesAsList(movie.Actors)}
                                    </li>
                                    <li><strong>Released:</strong> ${formatReleaseDate(movie.Released)}</li>
                                </ul>
                            </article>
                        `
                        bodyElement.append(article)
                    })
                } else {
                    bodyElement.append("Daten konnten nicht geladen werden, Status " + xhr.status + " - " + xhr.statusText)
                }
            }
            xhr.open("GET", "/movies")
            xhr.send()
        }
    </script>

</head>

<body>
</body>

</html>
